name: Inspect UsbAudioBridge Native Build

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar e inspeccionar configuracion C++
        run: |
          git clone https://github.com/Flopster101/UsbAudioBridge.git
          cd UsbAudioBridge
          echo "=== 1. Donde se menciona usbaudio ==="
          grep -rn "usbaudio" . || true
          echo "=== 2. Archivos de compilacion nativa ==="
          find . -maxdepth 5 \( -name "CMakeLists.txt" -o -name "*.mk" -o -name "Makefile" -o -name "*.gradle*" -o -name "*.yml" \)
          echo "=== 3. Contenido de .github/workflows ==="
          cat .github/workflows/*.yml || true
          echo "=== 4. Contenido de app/build.gradle.kts ==="
          cat app/build.gradle.kts || true
          echo "=== 5. Contenido de CMakeLists.txt / Makefiles ==="
          find app -name "CMakeLists.txt" -o -name "Makefile" -o -name "*.mk" | while read f; do
            echo "--- Archivo: $f ---"
            cat "$f"
          done
