name: Build USB Audio Bridge APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonar UsbAudioBridge con submodulos (oboe + tinyalsa)
        run: |
          git clone --recursive https://github.com/Flopster101/UsbAudioBridge.git

      - name: Compilar APK
        working-directory: UsbAudioBridge
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Listar APKs generados y sus librerias .so
        working-directory: UsbAudioBridge
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "=== Archivo: $apk ==="
            unzip -l "$apk" | grep "\.so" || true
          done

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: UsbAudioBridge-Fixed-APK
          path: UsbAudioBridge/app/build/outputs/apk/debug/*.apk
