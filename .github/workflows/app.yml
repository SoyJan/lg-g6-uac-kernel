name: Build Optimized UsbAudioBridge APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonar UsbAudioBridge con submodulos
        run: |
          git clone --recursive https://github.com/Flopster101/UsbAudioBridge.git

      - name: Parchar bug del autor en app/build.gradle.kts
        working-directory: UsbAudioBridge
        run: |
          sed -i 's/targets.add("gadget_monitor_pause")/targets.add("gadget_monitor_pause")\n                targets.add("usbaudio")/' app/build.gradle.kts

      - name: Compilar APK OptimizedDebug (-O3 -ffast-math + R8)
        working-directory: UsbAudioBridge
        run: |
          chmod +x gradlew
          ./gradlew assembleOptimizedDebug --no-daemon

      - name: Verificar libusbaudio.so dentro del APK
        working-directory: UsbAudioBridge
        run: |
          unzip -l app/build/outputs/apk/optimizedDebug/*.apk | grep libusbaudio.so

      - name: Subir APK Optimizado
        uses: actions/upload-artifact@v4
        with:
          name: UsbAudioBridge-Optimized-APK
          path: UsbAudioBridge/app/build/outputs/apk/optimizedDebug/*.apk
