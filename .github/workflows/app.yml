name: Build Patched UsbAudioBridge APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clonar UsbAudioBridge con submodulos (oboe + tinyalsa)
        run: |
          git clone --recursive https://github.com/Flopster101/UsbAudioBridge.git

      - name: Parchar bug del autor en app/build.gradle.kts
        working-directory: UsbAudioBridge
        run: |
          sed -i 's/targets.add("gadget_monitor_pause")/targets.add("gadget_monitor_pause")\n                targets.add("usbaudio")/' app/build.gradle.kts
          grep -n -C 3 'targets.add' app/build.gradle.kts

      - name: Compilar APK completo
        working-directory: UsbAudioBridge
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar que libusbaudio.so ahora SI esta dentro del APK
        working-directory: UsbAudioBridge
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libusbaudio.so

      - name: Subir APK reparado
        uses: actions/upload-artifact@v4
        with:
          name: UsbAudioBridge-Fixed-APK
          path: UsbAudioBridge/app/build/outputs/apk/debug/app-debug.apk
